
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discordery - Discover the best Discord servers</title>
    <meta name="description" content="Explore and discover the best Discord servers for gaming, education, programming, art, music, and more." />
    <script>
      // Force reload once to ensure session cookies are processed
      if (window.location.pathname === '/' && localStorage.getItem('auth_reload_needed') === 'true') {
        localStorage.removeItem('auth_reload_needed');
        console.log('Reloading to process authentication cookies...');
        window.location.reload();
      } else if (window.location.pathname === '/discord-auth') {
        localStorage.setItem('auth_reload_needed', 'true');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
